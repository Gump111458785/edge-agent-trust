name: Member C trust verification

on:
  pull_request:
    paths:
      - "trusted_release/**"
      - ".github/workflows/member-c.yml"
  push:
    paths:
      - "trusted_release/**"
      - ".github/workflows/member-c.yml"

permissions:
  contents: read

jobs:
  trust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            trusted_release/requirements*.txt
            business/requirements*.txt
      - run: python -m pip install -r trusted_release/requirements-test.txt
      - run: python -B -m pytest -q -p no:cacheprovider business/tests trusted_release/tests
      - run: python -B -m trusted_release.demo

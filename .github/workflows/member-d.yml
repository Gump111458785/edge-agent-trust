name: Member D evidence gateway

on:
  pull_request:
    paths:
      - 'gateway/**'
      - 'business/**'
      - 'trusted_release/**'
      - '.github/workflows/member-d.yml'
  push:
    paths:
      - 'gateway/**'
      - 'business/**'
      - 'trusted_release/**'
      - '.github/workflows/member-d.yml'

permissions:
  contents: read

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            gateway/requirements*.txt
            business/requirements*.txt
            trusted_release/requirements.txt
      - run: python -m pip install -r gateway/requirements-dev.txt
      - run: python -B -m pytest -q -p no:cacheprovider business/tests gateway/tests trusted_release/tests/test_release.py
      - run: python -B -m evaluation.run_benchmark
